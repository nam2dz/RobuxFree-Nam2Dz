<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nam2Dz Mod</title>

<style>
body{
  margin:0;font-family:Arial,sans-serif;
  background:#0f0f0f;color:#fff;text-align:center
}
.header{
  background:#1f1f1f;padding:14px;
  font-size:20px;font-weight:bold
}
.sub{font-size:13px;color:#00ff9c;margin-top:4px}
.card{
  background:#1c1c1c;width:360px;max-width:92%;
  margin:40px auto;padding:25px;border-radius:14px;
  animation:glow 3s infinite alternate
}
@keyframes glow{
  from{box-shadow:0 0 8px rgba(0,255,156,.15)}
  to{box-shadow:0 0 22px rgba(0,255,156,.45)}
}
input,select{
  width:100%;padding:11px;border-radius:10px;
  border:none;margin-bottom:12px
}
button{
  width:100%;padding:12px;background:#00b06f;
  border:none;border-radius:10px;
  font-size:16px;color:#fff;cursor:pointer
}
button:disabled{background:#555}
.note{font-size:12px;color:#aaa;margin-bottom:10px}

#loading,#success{display:none;margin-top:14px}
.progress{background:#333;border-radius:10px;overflow:hidden}
.bar{height:14px;width:0%;background:#00ff9c}
#percent{font-weight:bold}

.shake{animation:shake .15s infinite}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-1px)}
  50%{transform:translateX(1px)}
  75%{transform:translateX(-1px)}
  100%{transform:translateX(0)}
}

/* Toast */
#toast{
  position:fixed;top:18px;left:50%;
  transform:translateX(-50%);
  background:#1f1f1f;padding:10px 16px;
  border-radius:10px;display:none;
  z-index:10001;font-size:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.4)
}
#toast b{color:#00ff9c}

/* Fullscreen video */
#fullscreenVideo{
  display:none;position:fixed;inset:0;
  background:#000;z-index:9999
}
#fullscreenVideo iframe{width:100%;height:100%}

/* Watermark */
#wm{
  position:fixed;bottom:10px;right:14px;
  font-size:13px;color:#00ff9c;
  opacity:.7;z-index:10000
}
</style>
</head>

<body>

<div class="header">
  ROBLOX ROBUX MOD
  <div class="sub">Nam2Dz Mod</div>
</div>

<div class="card">
  <h2>Nhận Robux</h2>
  <div class="note">Hệ thống đang xử lý – vui lòng không thoát</div>

  <p style="color:#00ff9c;font-size:13px">
    👥 Người đang truy cập: <span id="online">148</span>
  </p>

  <input id="username" placeholder="Tên người chơi (≥ 3 ký tự)">
  <select id="robux">
    <option value="">-- Chọn số Robux --</option>
    <option>1500 Robux</option>
    <option>3000 Robux</option>
    <option>5000 Robux</option>
    <option>7500 Robux</option>
    <option>10000 Robux</option>
    <option>25000 Robux</option>
    <option>50000 Robux</option>
    <option>100000 Robux</option>
  </select>

  <button id="btn" onclick="start()">BẮT ĐẦU</button>

  <div id="loading">
    <p id="status">Đang khởi tạo…</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <p id="percent">0%</p>
  </div>

  <div id="success">
    <h3>✅ HOÀN TẤT</h3>
    <p id="successText"></p>
  </div>
</div>

<div id="toast"></div>

<div id="fullscreenVideo">
  <iframe id="yt" frameborder="0"
    allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<div id="wm">Nam2Dz Mod</div>

<script>
// ===== Online counter 100–200 =====
let online=148;
setInterval(()=>{
  let d=Math.floor(Math.random()*5)-2;
  online+=d;
  if(online<102) online=102;
  if(online>198) online=198;
  document.getElementById("online").innerText=online;
},1600);

// ===== Toast =====
function showToast(html){
  const t=document.getElementById("toast");
  t.innerHTML=html;
  t.style.display="block";
  clearTimeout(t._to);
  t._to=setTimeout(()=>t.style.display="none",2600);
}

// ===== Random tên người đã nhận =====
const vnNames=[
  "AnhHuy","MinhQuan","DucAnh","ThanhDat",
  "QuangHuy","TuanAnh","GiaBao","HoangLong"
];
const chars="abcdefghijklmnopqrstuvwxyz";
let lastName="";

function randomTail(){
  let s="";
  for(let i=0;i<3;i++){
    let c=chars[Math.floor(Math.random()*chars.length)];
    s+=Math.random()>.5?c.toUpperCase():c;
  }
  s+=Math.floor(Math.random()*10);
  return s;
}

function genPlayerName(){
  let name="";
  do{
    if(Math.random()>.5){
      const base=vnNames[Math.floor(Math.random()*vnNames.length)];
      const year=Math.random()>.6?"2K"+(6+Math.floor(Math.random()*4)):"";
      name=base+year+randomTail();
    }else{
      name=randomTail()+randomTail();
    }
  }while(name===lastName);
  lastName=name;
  return name;
}

const robuxList=[1500,3000,5000,7500,10000,25000,50000,100000];

// Thông báo nền
setInterval(()=>{
  const n=genPlayerName();
  const r=robuxList[Math.floor(Math.random()*robuxList.length)];
  showToast(`🎉 <b>${n}</b> đã nhận <b>${r} Robux</b>`);
},6000);

// ===== Start =====
function start(){
  const user=document.getElementById("username").value.trim();
  const robux=document.getElementById("robux").value;

  if(user.length<3){alert("Tên phải từ 3 ký tự trở lên");return;}
  if(/^\d+$/.test(user)){
    alert("Tên người chơi không được chỉ chứa số");
    return;
  }
  if(!robux){alert("Vui lòng chọn Robux");return;}

  document.getElementById("btn").disabled=true;
  document.getElementById("loading").style.display="block";
  showToast(`🔍 Đang tìm người chơi <b>${user}</b>…`);

  const bar=document.getElementById("bar");
  const percent=document.getElementById("percent");
  const status=document.getElementById("status");
  const card=document.querySelector(".card");

  let i=0;
  const run=setInterval(()=>{
    let step=(i>70&&i<90)?1:(Math.floor(Math.random()*2)+1);
    i=Math.min(100,i+step);
    bar.style.width=i+"%";
    percent.innerText=i+"%";

    if(i<20) status.innerText="Tìm tên người chơi…";
    else if(i<45) status.innerText="Xác minh tài khoản…";
    else if(i<70) status.innerText="Chuẩn bị chuyển Robux…";
    else if(i<90) status.innerText="Đang chuyển Robux…";
    else status.innerText="Hoàn tất…";

    if(i>85&&i<99) card.classList.add("shake");
    else card.classList.remove("shake");

    if(i===25) showToast("✅ Đã tìm thấy người chơi");
    if(i===55) showToast("📡 Đang kết nối hệ thống");
    if(i===80) showToast("💰 Đang chuyển Robux");

    if(i>=100){
      clearInterval(run);
      document.getElementById("success").style.display="block";
      document.getElementById("successText").innerText=
        `${user} • ${robux}`;
      showToast("🎉 Hoàn tất!");

      // Rickroll fullscreen
      const fs=document.getElementById("fullscreenVideo");
      const yt=document.getElementById("yt");
      fs.style.display="block";
      yt.src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";

      if(fs.requestFullscreen) fs.requestFullscreen();
      else if(fs.webkitRequestFullscreen) fs.webkitRequestFullscreen();
    }
  },140);
}
</script>

</body>
</html>
